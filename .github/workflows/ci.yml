name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  server-image:
    runs-on: ubuntu-latest
    env:
      PAIRING_CODE: CI7XM4PQ
    steps:
      - uses: actions/checkout@v7
      - run: docker build --platform linux/amd64 -f server/Dockerfile -t order-processor-server:ci .
      - name: Run the image with a throwaway self-signed certificate
        run: |
          certs="$RUNNER_TEMP/certs"
          mkdir -p "$certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout "$certs/kirbe.key" -out "$certs/kirbe.crt"
          # The container runs as uid 1000, not the runner's user.
          chmod 0644 "$certs/kirbe.key"
          docker run -d --name kirbe-server -p 8443:8443 \
            -e PAIRING_CODE -e ALLOWED_ORIGIN=https://lharzenetter.github.io \
            -e CERT_FILE=/certs/kirbe.crt -e KEY_FILE=/certs/kirbe.key -e DATA_DIR=/data \
            -v "$certs:/certs:ro" \
            --health-cmd "node server/healthcheck.ts" --health-interval 2s --health-retries 15 \
            order-processor-server:ci
      - name: Wait until the container reports healthy
        run: |
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' kirbe-server)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: GET /log answers 200 with the pairing code and 401 without
        run: |
          test "$(curl -sk -o /dev/null -w '%{http_code}' -H "X-Pairing-Code: $PAIRING_CODE" https://localhost:8443/log)" = 200
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/log)" = 401
      - run: docker compose -f deploy/compose.yaml --env-file deploy/env.example config
      - if: always()
        run: docker logs kirbe-server || true

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.tag.outputs.published }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A release always adds the version-bump commit, so HEAD moves only when one was published.
      - id: tag
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Built after the release commit so the footer shows the new version.
      - if: steps.tag.outputs.published == 'true'
        run: pnpm build
      - if: steps.tag.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: needs.release.outputs.published == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Every release gets a server image, UI-only ones included. Never tagged latest: the Pi pins an
  # exact version in .env.
  image:
    if: needs.release.outputs.published == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/lharzenetter/order-processor-server:${{ steps.version.outputs.version }}
