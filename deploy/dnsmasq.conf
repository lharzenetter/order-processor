# Copied to /opt/kirbe/dnsmasq.conf. Replace the placeholders: kirbe.example.org with
# kirbe.<DOMAIN>, 192.168.178.2 with PI_IP (both from .env), and 192.168.178.1 with the FRITZ!Box.

# The answers below are the whole setup; the Pi's own resolver and hosts file play no part.
no-resolv
no-hosts
domain-needed
bogus-priv

# Everything else goes to the FRITZ!Box.
server=192.168.178.1

# The sync server, which has no public A record.
address=/kirbe.example.org/192.168.178.2

# NXDOMAIN for these makes iCloud Private Relay turn itself off on this network, so every iPad asks
# this resolver for kirbe.<domain>.
address=/mask.icloud.com/
address=/mask-h2.icloud.com/
