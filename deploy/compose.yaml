# Mirrors C:\kirbe\ on the venue machine, a Windows PC running Docker Desktop, and is copied there
# as-is. No venue values live here: they come from .env next to this file (see env.example).
# The pager bridge is not in here: it runs on Windows itself, as a service (install-bridge.ps1).
name: kirbe

services:
  server:
    # An exact release, never latest: a new FORMAT_VERSION reaches the Fest only with a bumped tag.
    image: ghcr.io/lharzenetter/order-processor-server:${SERVER_TAG:?set SERVER_TAG in .env}
    restart: unless-stopped
    environment:
      PAIRING_CODE: ${PAIRING_CODE:?set PAIRING_CODE in .env}
      ALLOWED_ORIGIN: https://lharzenetter.github.io
      CERT_FILE: /certs/certificates/kirbe.${DOMAIN:?set DOMAIN in .env}.crt
      KEY_FILE: /certs/certificates/kirbe.${DOMAIN}.key
      DATA_DIR: /data
      # Empty means the server's default, http://host.docker.internal:9186: the bridge on this PC.
      BRIDGE_URL: ${BRIDGE_URL:-}
    volumes:
      - ./certs:/certs:ro
      # A named volume inside Docker Desktop's VM, not a folder on C:. SQLite runs the log in WAL
      # mode, which needs a Linux file system, not a Windows folder shared into the container.
      - data:/data
    ports:
      - "443:8443"
    healthcheck:
      test: ["CMD", "node", "server/healthcheck.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Never starts by itself. Renews unconditionally, at home before each Fest:
  #   docker compose run --rm lego renew --days 90
  # The very first certificate is issued with `docker compose run --rm lego run`.
  lego:
    image: goacme/lego:v4.26.0
    profiles: [renew]
    user: "1000:1000"
    env_file: secrets/ionos.env
    environment:
      LEGO_PATH: /certs
    entrypoint:
      - /lego
      - --accept-tos
      - --dns
      - ionos
      - --domains
      - kirbe.${DOMAIN}
    command: [renew, --days, "90"]
    volumes:
      - ./certs:/certs

volumes:
  # Takes the image's /data, owned by the server's user, when it is first created.
  data:
